<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>19 · Aurora boreal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.7);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.55);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .btn {
      position: fixed; top: 16px; right: 16px;
      color: rgba(255,255,255,0.75); cursor: pointer;
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      background: rgba(0,0,0,0.4); user-select: none; z-index: 10;
    }
    .btn:hover { color:#a0ffb8; border-color:#a0ffb8; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="btn" id="regen">↻ nueva aurora</div>
  <div class="label">19 · aurora boreal · cortinas onduladas verde/púrpura sobre cielo estrellado</div>
  <canvas id="c"></canvas>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec2 uSeed;

    float hash12(vec2 p) { p += uSeed; return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    vec2  hash22(vec2 p) { p += uSeed; p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      float a = hash12(i), b = hash12(i+vec2(1,0));
      float c = hash12(i+vec2(0,1)), d = hash12(i+vec2(1,1));
      vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 6; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return v;
    }

    // ── stars (3x3 neighbour sampling to avoid square halo clipping) ──
    vec3 stars(vec2 uv) {
      vec3 acc = vec3(0.0);
      for (int layer = 0; layer < 3; layer++) {
        float scale = 70.0 * pow(2.2, float(layer));
        float density = 0.18 - float(layer) * 0.04;
        vec2 g = uv * scale;
        vec2 cell = floor(g);
        vec2 f = fract(g);
        for (int dy = -1; dy <= 1; dy++) {
          for (int dx = -1; dx <= 1; dx++) {
            vec2 c = cell + vec2(float(dx), float(dy));
            float pres = hash12(c + float(layer) * 7.7);
            if (pres > density) continue;
            vec2 off = hash22(c + 1.11 + float(layer));
            vec2 d = f - vec2(float(dx), float(dy)) - off;
            float dist = length(d);
            if (dist > 1.4) continue;
            float sz = 0.04 / pow(2.0, float(layer));
            float u = hash12(c + 77.7 + float(layer));
            float flux = pow(10.0, -0.4 * (6.5 - pow(u, 4.0) * 6.5 - 5.0));
            float twPh = hash12(c + 91.1) * 6.2831;
            float tw = 0.85 + 0.15 * sin(uTime * 1.3 + twPh);
            float core = exp(-dist*dist / (sz*sz*0.55)) * tw * flux;
            acc += vec3(1.0, 0.97, 0.92) * core * 0.5;
          }
        }
      }
      return acc;
    }

    // ── aurora curtain: SDF-like distance to a wavy vertical line ──
    // returns intensity in [0,1]
    float curtain(vec2 uv, float seed, float speed) {
      // wavy x as a function of y + time
      float t = uTime * speed;
      // multi-frequency wave displacement
      float waveX =
          sin(uv.y * 1.5 + t * 0.8 + seed) * 0.15
        + sin(uv.y * 3.7 + t * 1.2 + seed * 1.7) * 0.08
        + sin(uv.y * 7.1 + t * 1.6 + seed * 2.3) * 0.04
        + fbm(vec2(uv.y * 2.0 + t * 0.3, seed)) * 0.10 - 0.05;
      float xOffset = waveX;
      // horizontal distance to the curtain centerline
      float d = abs(uv.x - xOffset);
      // curtain has thickness varying along y
      float thickness = 0.04 + 0.03 * sin(uv.y * 4.0 + seed);
      // make it tighter
      float band = exp(-d * d / (thickness * thickness));
      // vertical fade: stronger at top, fades at bottom
      float vFade = smoothstep(-0.7, 0.5, uv.y) * smoothstep(0.7, -0.3, uv.y);
      return band * vFade;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

      // ── deep night sky ──
      vec3 col = mix(vec3(0.004, 0.005, 0.012), vec3(0.012, 0.014, 0.028), uv.y * 0.5 + 0.5);

      // ── stars BEHIND the aurora ──
      col += stars(uv);

      // ── aurora: multiple curtains ──
      vec3 aurora = vec3(0.0);
      // typical aurora colors: oxygen green (557.7nm), red oxygen (630nm), purple nitrogen
      vec3 greenCol  = vec3(0.10, 1.00, 0.55);
      vec3 purpleCol = vec3(0.55, 0.30, 1.00);
      vec3 pinkCol   = vec3(1.00, 0.40, 0.75);

      // 5 curtains at different x positions, speeds, seeds
      for (int i = 0; i < 5; i++) {
        float fi = float(i);
        float xCenter = -0.6 + fi * 0.3;
        float seed = fi * 13.7 + uSeed.x * 0.001;
        float speed = 0.3 + fi * 0.15;
        vec2 uvCurtain = vec2(uv.x - xCenter, uv.y);
        float c = curtain(uvCurtain, seed, speed);
        // gradient inside curtain: green at top, purple/pink at bottom
        vec3 colC = mix(purpleCol, greenCol, smoothstep(-0.5, 0.4, uv.y));
        colC = mix(colC, pinkCol, smoothstep(0.3, 0.6, uv.y) * 0.5);
        // vertical streaks inside (the typical aurora ray look)
        float stripe = 0.6 + 0.4 * sin(uvCurtain.x * 60.0 + fbm(uv * 3.0) * 8.0 + uTime * 0.5);
        aurora += colC * c * stripe * 1.2;
      }

      // ── horizon glow band ──
      float horizonGlow = exp(-(uv.y + 0.55) * (uv.y + 0.55) * 30.0);
      aurora += greenCol * horizonGlow * 0.4;

      // ── soft bloom of aurora ──
      // (cheap fake bloom: sample neighborhood already done by smooth noise)
      col += aurora * 0.9;

      // additive glow makes background slightly tinted near auroras
      float aBrightness = (aurora.r + aurora.g + aurora.b) / 3.0;
      col += vec3(0.05, 0.12, 0.08) * aBrightness * 0.3;

      // ── distant mountain silhouette ──
      float mountainHeight = -0.50
        + fbm(vec2(uv.x * 2.5, 0.0)) * 0.08
        + fbm(vec2(uv.x * 7.0, 1.7)) * 0.04;
      if (uv.y < mountainHeight) {
        col = vec3(0.01, 0.012, 0.022);
        // snow gradient on top
        float snowFactor = smoothstep(mountainHeight - 0.04, mountainHeight, uv.y);
        col += vec3(0.05, 0.08, 0.12) * snowFactor * 0.6;
      }

      // grain
      float grain = (hash12(gl_FragCoord.xy + vec2(uTime * 73.0)) - 0.5) * 0.025;
      col += grain;

      // tone map
      col = col / (1.0 + col * 0.6);

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-family:monospace">WebGL no disponible</p>'; throw new Error('no webgl'); }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    function compile(t, s) {
      const sh = gl.createShader(t);
      gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
      return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uTime = gl.getUniformLocation(prog, 'uTime');
    const uSeed = gl.getUniformLocation(prog, 'uSeed');
    let seedX = Math.random() * 10000, seedY = Math.random() * 10000;
    document.getElementById('regen').addEventListener('click', () => {
      seedX = Math.random() * 10000;
      seedY = Math.random() * 10000;
    });

    const t0 = performance.now();
    function frame() {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (performance.now() - t0) / 1000);
      gl.uniform2f(uSeed, seedX, seedY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
