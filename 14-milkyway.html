<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>14 · Vía Láctea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">14 · banda galáctica con FBM domain-warp · dust lanes · densidad estelar variable</div>
  <canvas id="c"></canvas>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec2 uMouse;

    float hash12(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    vec2 hash22(vec2 p) {
      p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
      return fract(sin(p) * 43758.5453);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p);
      float a = hash12(i);
      float b = hash12(i + vec2(1.0, 0.0));
      float c = hash12(i + vec2(0.0, 1.0));
      float d = hash12(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 6; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    // domain warping for organic clouds
    float warpedFbm(vec2 p) {
      vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
      vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2)), fbm(p + 4.0 * q + vec2(8.3, 2.8)));
      return fbm(p + 4.0 * r);
    }

    // stars from cell-noise (size + temperature)
    vec3 cellStars(vec2 uv, float scale, float density, float baseSize, float boost) {
      vec2 g = uv * scale;
      vec2 cell = floor(g);
      vec2 f = fract(g);
      float pres = hash12(cell);
      if (pres > density) return vec3(0.0);

      vec2 r = hash22(cell);
      vec2 d = f - r;
      float dist = length(d);
      float sz = baseSize * (0.35 + hash12(cell + 17.3) * 1.2);

      float temp = hash12(cell + 51.2);
      vec3 col;
      // realistic mostly-white distribution with subtle hue
      if (temp < 0.55) col = mix(vec3(1.0, 0.78, 0.55), vec3(1.0), temp / 0.55);
      else             col = mix(vec3(1.0), vec3(0.7, 0.82, 1.0), (temp - 0.55) / 0.45);

      // magnitude: most dim, few bright (pareto-ish)
      float mag = pow(hash12(cell + 77.7), 5.0);
      mag = max(mag, 0.05);

      float twPhase = hash12(cell + 91.1) * 6.2831;
      float tw = 0.85 + 0.15 * sin(uTime * 1.4 + twPhase);

      float core = exp(-dist * dist / (sz * sz * 0.55)) * tw * mag * boost;
      float halo = exp(-dist / (sz * 3.0)) * 0.35 * tw * mag * boost;
      // diffraction cross for brightest cells
      float spike = 0.0;
      if (mag > 0.6) {
        float sH = exp(-abs(d.y) * 180.0) * exp(-abs(d.x) * 8.0);
        float sV = exp(-abs(d.x) * 180.0) * exp(-abs(d.y) * 8.0);
        spike = (sH + sV) * mag * 0.35;
      }
      return col * (core * 1.3 + halo + spike);
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

      // mouse parallax of milky way
      vec2 par = (uMouse - 0.5) * 0.3;
      vec2 mwUV = uv + par;

      // rotate the galactic plane diagonally
      float ang = 0.35;
      mat2 R = mat2(cos(ang), -sin(ang), sin(ang), cos(ang));
      vec2 mw = R * mwUV;

      // base sky color — very dark, slight blue
      vec3 col = vec3(0.005, 0.007, 0.018);

      // ambient glow
      col += vec3(0.012, 0.01, 0.02) * (0.5 + 0.5 * sin(uv.x * 0.7));

      // ─── Milky Way band ────────────────────────────────────
      // distance from galactic plane
      float bandDist = abs(mw.y);
      // base band envelope (very wide, soft)
      float band = exp(-bandDist * bandDist * 9.0);

      // turbulent clouds along the band
      vec2 nUV = mw * vec2(0.8, 3.5) + vec2(uTime * 0.005, 0.0);
      float clouds = warpedFbm(nUV);
      // boost contrast
      clouds = smoothstep(0.3, 0.85, clouds);

      // dust lanes — darker streaks ALONG the band
      vec2 dUV = mw * vec2(0.6, 6.0);
      float dust = fbm(dUV);
      dust = smoothstep(0.42, 0.7, dust);

      // galactic core glow (brightest near x = -0.4 or wherever the "center" is)
      float coreDist = length(mw - vec2(-0.3, 0.0));
      float core = exp(-coreDist * coreDist * 6.0);

      // assemble milky way color
      vec3 mwBase = vec3(0.20, 0.18, 0.30);   // cool purple-blue cloud
      vec3 mwBright = vec3(0.55, 0.45, 0.55); // brighter mid
      vec3 mwCore = vec3(0.95, 0.78, 0.60);   // warm core
      vec3 mwCol = mix(mwBase, mwBright, clouds);
      mwCol = mix(mwCol, mwCore, core * 0.7);

      // subtract dust
      mwCol *= (1.0 - dust * 0.85);

      // apply band envelope
      col += mwCol * band * clouds * 0.9;
      col += mwCore * core * band * 0.6;

      // ─── Stars ──────────────────────────────────────────────
      // density boost where milky way is bright
      float densityBoost = 1.0 + band * clouds * 2.5 + core * 1.5;

      // 3 layers
      col += cellStars(uv, 65.0,  0.12 * densityBoost, 0.05, 1.0);
      col += cellStars(uv + 7.1, 160.0, 0.06 * densityBoost, 0.025, 0.9);
      col += cellStars(uv + 31.3, 360.0, 0.03 * densityBoost, 0.012, 0.7);

      // a few very rare super-bright stars
      col += cellStars(uv + 55.5, 22.0, 0.05, 0.10, 1.4);

      // subtle vignette
      float vig = 1.0 - dot(uv, uv) * 0.35;
      col *= vig;

      // grain (very subtle)
      float grain = (hash12(gl_FragCoord.xy + vec2(uTime)) - 0.5) * 0.018;
      col += grain;

      // tone map (Reinhard-ish)
      col = col / (1.0 + col * 0.8);

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-family:monospace">WebGL no disponible</p>'; throw new Error('no webgl'); }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    function compile(t, s) {
      const sh = gl.createShader(t);
      gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
      return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uTime = gl.getUniformLocation(prog, 'uTime');
    const uMouse = gl.getUniformLocation(prog, 'uMouse');
    let mx = 0.5, my = 0.5;
    window.addEventListener('mousemove', e => {
      mx = e.clientX / window.innerWidth;
      my = 1 - e.clientY / window.innerHeight;
    });

    const t0 = performance.now();
    function frame() {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (performance.now() - t0) / 1000);
      gl.uniform2f(uMouse, mx, my);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
