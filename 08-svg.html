<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>08 · SVG self-drawing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#04060f; }
    svg { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .btn {
      position: fixed; top: 16px; right: 16px;
      color: rgba(255,255,255,0.6); cursor: pointer;
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4); user-select: none;
    }
    .btn:hover { color:#fff; border-color: #ffe6a8; }

    .star {
      fill: #fff;
      filter: url(#glow);
    }
    .star.warm { fill: #ffd6a8; }
    .star.cool { fill: #c8d8ff; }

    .line {
      fill: none;
      stroke: rgba(200, 215, 255, 0.55);
      stroke-width: 0.8;
      stroke-linecap: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      filter: url(#lineGlow);
    }

    .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">08 · SVG · stroke-dasharray animado · una mano invisible las traza</div>
  <div class="btn" id="redraw">↻ redraw</div>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

  <script>
    const svg = document.getElementById('svg');
    let W, H;

    function size() {
      W = window.innerWidth;
      H = window.innerHeight;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    }
    size();
    window.addEventListener('resize', () => { size(); build(); });

    function defs() {
      return `<defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="nebula" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#1a1530" stop-opacity="0.6"/>
          <stop offset="50%" stop-color="#0a0a18" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#04060f" stop-opacity="0"/>
        </radialGradient>
      </defs>`;
    }

    function rand(a, b) { return a + Math.random() * (b - a); }

    function build() {
      let s = defs();
      s += `<rect width="${W}" height="${H}" fill="url(#nebula)"/>`;

      // background faint stars
      const N_FAINT = Math.floor(W * H / 5000);
      for (let i = 0; i < N_FAINT; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        const r = Math.random() < 0.05 ? 1.4 : 0.4 + Math.random() * 0.5;
        const cls = Math.random() < 0.08 ? (Math.random() < 0.5 ? 'warm' : 'cool') : '';
        const delay = (Math.random() * 3).toFixed(2);
        s += `<circle class="star ${cls} twinkle" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" style="animation-delay:${delay}s"/>`;
      }

      // generate 5-8 constellations as polylines drawn over invisible bright stars
      const conCount = 5 + Math.floor(Math.random() * 4);
      const constellations = [];
      const brightStars = [];
      for (let c = 0; c < conCount; c++) {
        const cx = rand(W * 0.15, W * 0.85);
        const cy = rand(H * 0.15, H * 0.85);
        const numNodes = 4 + Math.floor(Math.random() * 5);
        const radius = Math.min(W, H) * (0.08 + Math.random() * 0.05);
        const nodes = [];
        for (let n = 0; n < numNodes; n++) {
          const ang = rand(0, Math.PI * 2);
          const r = rand(radius * 0.3, radius);
          nodes.push([cx + Math.cos(ang) * r, cy + Math.sin(ang) * r]);
        }
        // path traversal: nearest-neighbor walk from first node
        const visited = [0];
        const remaining = nodes.map((_, i) => i).slice(1);
        while (remaining.length) {
          const last = visited[visited.length - 1];
          let best = -1, bd = Infinity;
          for (const i of remaining) {
            const dx = nodes[last][0] - nodes[i][0];
            const dy = nodes[last][1] - nodes[i][1];
            const d = dx * dx + dy * dy;
            if (d < bd) { bd = d; best = i; }
          }
          visited.push(best);
          remaining.splice(remaining.indexOf(best), 1);
        }
        const pathD = visited.map((idx, k) => (k === 0 ? 'M' : 'L') + nodes[idx][0].toFixed(1) + ' ' + nodes[idx][1].toFixed(1)).join(' ');
        constellations.push({ d: pathD });
        nodes.forEach(n => brightStars.push(n));
      }

      // draw bright stars as larger nodes
      brightStars.forEach(([x, y], i) => {
        const r = 1.6 + Math.random() * 1.0;
        const cls = Math.random() < 0.3 ? (Math.random() < 0.5 ? 'warm' : 'cool') : '';
        const delay = (Math.random() * 4).toFixed(2);
        s += `<circle class="star ${cls} twinkle" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" style="animation-delay:${delay}s;filter:url(#glow);"/>`;
      });

      // constellation paths with animated dasharray
      constellations.forEach((c, i) => {
        s += `<path class="line" d="${c.d}" data-i="${i}"/>`;
      });

      svg.innerHTML = s;

      // animate the lines
      let maxFinish = 0;
      svg.querySelectorAll('.line').forEach((path, i) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        const dur = 2500 + Math.random() * 2000;
        const delay = 400 + i * 600;
        path.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.4, 0.0, 0.2, 1) ${delay}ms, opacity 1500ms ease-in-out`;
        maxFinish = Math.max(maxFinish, delay + dur);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            path.style.strokeDashoffset = '0';
          });
        });
      });

      // after all lines finished + a pause, fade them out, then rebuild
      const totalCycle = maxFinish + 4500; // 4.5s pause to admire
      clearTimeout(window.__svgLoopTimer);
      window.__svgLoopTimer = setTimeout(() => {
        svg.querySelectorAll('.line').forEach(p => { p.style.opacity = '0'; });
        setTimeout(build, 1700);
      }, totalCycle);
    }
    build();

    document.getElementById('redraw').addEventListener('click', build);
  </script>
</body>
</html>
