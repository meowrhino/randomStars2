<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>18 · Cinematic astrophoto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.7);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.55);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">18 · cinematic · GLSL · HDR bloom + chromatic aberration + lens dust + grain · DSLR look</div>
  <canvas id="c"></canvas>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;

    // ── hash & noise ────────────────────────────────────────
    float hash12(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    vec2  hash22(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      float a = hash12(i), b = hash12(i + vec2(1,0));
      float c = hash12(i + vec2(0,1)), d = hash12(i + vec2(1,1));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    float warpedFbm(vec2 p) {
      vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
      return fbm(p + 4.0 * q);
    }

    // ── pareto magnitude → flux ─────────────────────────────
    // returns vec2(flux, color hue index)
    float paretoFlux(float u) {
      float mag = 6.5 - pow(u, 4.0) * 6.5;
      return pow(10.0, -0.4 * (mag - 5.0));
    }
    vec3 spectralColor(float t) {
      // mostly white-yellow with subtle hue
      if (t < 0.04)  return vec3(0.72, 0.80, 1.00); // hot blue
      if (t < 0.18)  return vec3(0.94, 0.96, 1.00); // blue-white
      if (t < 0.55)  return vec3(1.00, 0.98, 0.91); // sun yellow
      if (t < 0.88)  return vec3(1.00, 0.87, 0.73); // orange
      return            vec3(1.00, 0.73, 0.60);     // red
    }

    // ── single star evaluation in a cell ────────────────────
    // returns RGB additive contribution at uv from stars near it
    vec3 starsLayer(vec2 uv, float scale, float density, float sizeBase) {
      vec3 acc = vec3(0.0);
      vec2 g = uv * scale;
      vec2 cell = floor(g);
      vec2 f = fract(g);
      // sample 3x3 neighbour cells so halos/spikes from neighbours leak in
      for (int dy = -1; dy <= 1; dy++) {
        for (int dx = -1; dx <= 1; dx++) {
          vec2 c = cell + vec2(dx, dy);
          float pres = hash12(c);
          if (pres > density) continue;
          vec2 off = hash22(c + 1.11);
          vec2 d = f - off - vec2(dx, dy);

          float u  = hash12(c + 77.7);
          float flux = paretoFlux(u);
          float temp = hash12(c + 51.2);
          vec3 col = spectralColor(temp);

          float twPh = hash12(c + 91.1) * 6.2831;
          float tw = 0.88 + 0.12 * sin(uTime * 1.3 + twPh);

          // PSF: gaussian core + exponential halo
          float dist = length(d);
          float sz = sizeBase * (0.4 + flux * 0.05);
          float core = exp(-dist * dist / (sz * sz * 0.55));
          float halo = exp(-dist / (sz * 4.0)) * 0.18;
          float fluxN = flux * tw;
          acc += col * (core * 1.4 + halo) * fluxN;

          // diffraction spikes: ONLY for bright stars
          if (flux > 4.0) {
            float spikeStrength = clamp((flux - 4.0) * 0.12, 0.0, 0.7);
            float lenH = exp(-abs(d.y) * 220.0);
            float falloffH = exp(-abs(d.x) * 4.0);
            float lenV = exp(-abs(d.x) * 220.0);
            float falloffV = exp(-abs(d.y) * 4.0);
            acc += col * (lenH * falloffH + lenV * falloffV) * spikeStrength;
            // diagonals — softer
            if (flux > 9.0) {
              vec2 dr = mat2(0.707, -0.707, 0.707, 0.707) * d;
              float lH = exp(-abs(dr.y) * 280.0) * exp(-abs(dr.x) * 6.0);
              float lV = exp(-abs(dr.x) * 280.0) * exp(-abs(dr.y) * 6.0);
              acc += col * (lH + lV) * spikeStrength * 0.4;
            }
          }
        }
      }
      return acc;
    }

    // sample the full sky color at one UV — used for chromatic aberration
    vec3 skyColor(vec2 uv) {
      vec3 col = vec3(0.0);
      // base bg gradient
      vec3 bg = mix(vec3(0.004, 0.005, 0.012), vec3(0.010, 0.008, 0.020), uv.y * 0.5 + 0.5);
      col = bg;

      // faint nebula (very subtle)
      float n = warpedFbm(uv * 1.2 + vec2(uTime * 0.005, 0.0));
      n = smoothstep(0.4, 0.85, n);
      col += vec3(0.04, 0.02, 0.08) * n * 0.4;
      col += vec3(0.02, 0.05, 0.08) * (1.0 - n) * 0.15;

      // 4 layers of stars
      col += starsLayer(uv, 50.0,  0.20, 0.04);
      col += starsLayer(uv + 7.3,  120.0, 0.10, 0.022);
      col += starsLayer(uv + 31.7, 280.0, 0.05, 0.011);
      col += starsLayer(uv + 55.1, 20.0,  0.06, 0.10); // rare bright

      return col;
    }

    void main() {
      // square-ish coords, centered
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

      // ── chromatic aberration ──
      // shift R and B channels radially based on distance from center
      float r2 = dot(uv, uv);
      vec2 dir = uv * 0.006 * (1.0 + r2 * 2.5);
      vec3 colR = skyColor(uv + dir);
      vec3 colG = skyColor(uv);
      vec3 colB = skyColor(uv - dir);
      vec3 col = vec3(colR.r, colG.g, colB.b);

      // ── lens dust spots (faint) ──
      vec2 dustUV = uv * 3.5;
      float dust = 0.0;
      for (int i = 0; i < 4; i++) {
        float fi = float(i);
        vec2 dc = floor(dustUV + fi * 1.7);
        vec2 df = fract(dustUV + fi * 1.7) - hash22(dc);
        float dd = length(df);
        if (hash12(dc + fi * 11.1) > 0.97) {
          dust += exp(-dd * 30.0) * 0.04;
        }
      }
      col += vec3(0.4, 0.45, 0.5) * dust;

      // ── vignette ──
      float vig = pow(1.0 - r2 * 0.7, 1.3);
      col *= clamp(vig, 0.4, 1.0);

      // ── tone map (filmic Reinhard) ──
      col = col / (1.0 + col * 0.7);
      col = pow(col, vec3(0.92)); // slight gamma boost in shadows

      // ── grain ──
      float grain = (hash12(gl_FragCoord.xy + vec2(uTime * 41.0)) - 0.5) * 0.035;
      col += grain;

      // ── subtle teal-orange grade ──
      col.r = mix(col.r, col.r * 1.05 + 0.005, 0.5);
      col.b = mix(col.b, col.b * 1.08 + 0.005, 0.5);

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-family:monospace">WebGL no disponible</p>'; throw new Error('no webgl'); }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    function compile(t, s) {
      const sh = gl.createShader(t);
      gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
      return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uTime = gl.getUniformLocation(prog, 'uTime');

    const t0 = performance.now();
    function frame() {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (performance.now() - t0) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
