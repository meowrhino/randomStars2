<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>06 · 3D parallax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .hint {
      position: fixed; top: 16px; right: 16px;
      color: rgba(255,255,255,0.5);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">06 · profundidad z + parallax · scroll/drag para volar más rápido</div>
  <div class="hint">mueve el mouse · scroll para velocidad</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H, cx, cy;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2; cy = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    const N = 1200;
    const Z_MAX = 1.0;
    const FOV = 320;
    let speed = 0.005;
    const stars = [];
    for (let i = 0; i < N; i++) {
      stars.push({
        x: (Math.random() - 0.5) * 2,    // -1..1
        y: (Math.random() - 0.5) * 2,
        z: Math.random() * Z_MAX,
        col: pickColor(),
        sz: Math.random() < 0.04 ? 1.6 : 0.8 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2
      });
    }
    function pickColor() {
      const r = Math.random();
      if (r < 0.05) return [200, 220, 255];
      if (r < 0.12) return [255, 220, 180];
      if (r < 0.14) return [255, 190, 170];
      return [255, 255, 255];
    }

    let mx = 0, my = 0, tx = 0, ty = 0;
    window.addEventListener('mousemove', e => {
      tx = (e.clientX / W - 0.5);
      ty = (e.clientY / H - 0.5);
    });
    window.addEventListener('wheel', e => {
      speed = Math.max(0.0008, Math.min(0.05, speed + e.deltaY * 0.00005));
    }, { passive: true });

    const t0 = performance.now();
    function draw() {
      const t = (performance.now() - t0) / 1000;

      // trailing motion blur background
      ctx.fillStyle = 'rgba(2, 3, 8, 0.45)';
      ctx.fillRect(0, 0, W, H);

      // ease mouse
      mx += (tx - mx) * 0.06;
      my += (ty - my) * 0.06;

      // sort by z so closer stars draw on top
      stars.sort((a, b) => b.z - a.z);

      for (const s of stars) {
        s.z -= speed;
        if (s.z <= 0.001) {
          // respawn far
          s.x = (Math.random() - 0.5) * 2;
          s.y = (Math.random() - 0.5) * 2;
          s.z = Z_MAX;
          s.col = pickColor();
          s.phase = Math.random() * Math.PI * 2;
        }

        // perspective project
        const k = FOV / (s.z * 1000 + 50);
        const px = cx + (s.x - mx * 0.3) * 1000 * k;
        const py = cy + (s.y - my * 0.3) * 1000 * k;

        if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;

        const closeness = 1 - s.z;
        const r = s.sz * (0.4 + closeness * 2.5);
        const tw = 0.85 + 0.15 * Math.sin(t * 1.2 + s.phase);
        const a = closeness * tw;
        const [cr, cg, cb] = s.col;

        // streak (length proportional to speed and closeness)
        const streakLen = Math.min(40, speed * 800 * closeness * closeness);
        if (streakLen > 1.5) {
          const dx = (px - cx) * 0.02;
          const dy = (py - cy) * 0.02;
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a * 0.4})`;
          ctx.lineWidth = r * 0.6;
          ctx.beginPath();
          ctx.moveTo(px - dx * streakLen, py - dy * streakLen);
          ctx.lineTo(px, py);
          ctx.stroke();
        }

        ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        ctx.shadowColor = `rgba(${cr},${cg},${cb},${a * 0.8})`;
        ctx.shadowBlur = r * 4;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
