<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>03 · Poisson disk sampling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#04050a; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .meta {
      position: fixed; bottom: 16px; right: 16px;
      color: rgba(255,255,255,0.35);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">03 · Bridson Poisson-disk · distribución natural sin clusters</div>
  <div class="meta" id="meta"></div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const meta = document.getElementById('meta');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();

    // Bridson's algorithm — Fast Poisson Disk Sampling
    // r = minimum distance, k = attempts per active point
    function poisson(width, height, r, k = 30) {
      const cellSize = r / Math.SQRT2;
      const cols = Math.ceil(width / cellSize);
      const rows = Math.ceil(height / cellSize);
      const grid = new Array(cols * rows).fill(null);
      const active = [];
      const points = [];

      const seed = [Math.random() * width, Math.random() * height];
      const seedCell = (Math.floor(seed[0] / cellSize)) + cols * Math.floor(seed[1] / cellSize);
      grid[seedCell] = seed;
      active.push(seed);
      points.push(seed);

      while (active.length) {
        const idx = Math.floor(Math.random() * active.length);
        const [px, py] = active[idx];
        let found = false;
        for (let i = 0; i < k; i++) {
          const ang = Math.random() * Math.PI * 2;
          const mag = r + Math.random() * r;
          const x = px + Math.cos(ang) * mag;
          const y = py + Math.sin(ang) * mag;
          if (x < 0 || x >= width || y < 0 || y >= height) continue;

          const col = Math.floor(x / cellSize);
          const row = Math.floor(y / cellSize);
          let ok = true;
          for (let dy = -2; dy <= 2 && ok; dy++) {
            for (let dx = -2; dx <= 2 && ok; dx++) {
              const c = col + dx, rr = row + dy;
              if (c < 0 || c >= cols || rr < 0 || rr >= rows) continue;
              const n = grid[c + cols * rr];
              if (n && (n[0]-x)*(n[0]-x) + (n[1]-y)*(n[1]-y) < r*r) ok = false;
            }
          }
          if (ok) {
            const np = [x, y];
            grid[col + cols * row] = np;
            active.push(np);
            points.push(np);
            found = true;
            break;
          }
        }
        if (!found) active.splice(idx, 1);
      }
      return points;
    }

    let stars = [];

    function build() {
      // small r → more density. We vary brightness/size per star.
      const r = Math.max(14, Math.min(W, H) * 0.022);
      const raw = poisson(W, H, r);
      stars = raw.map((p, i) => ({
        x: p[0], y: p[1],
        size: Math.random() < 0.05 ? 1.8 + Math.random() * 1.2 : 0.5 + Math.random() * 0.9,
        alpha: 0.4 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.3 + Math.random() * 0.9,
        color: pickColor()
      }));
      meta.textContent = `${stars.length} estrellas · r=${r.toFixed(1)}px`;
    }

    function pickColor() {
      const r = Math.random();
      if (r < 0.04) return [200, 215, 255];   // blue
      if (r < 0.10) return [255, 220, 180];   // warm
      if (r < 0.12) return [255, 180, 150];   // red giant
      return [255, 255, 255];
    }

    build();

    let t0 = performance.now();
    function draw() {
      const t = (performance.now() - t0) / 1000;
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        const tw = 0.85 + 0.15 * Math.sin(t * s.twinkleSpeed + s.phase);
        const a = s.alpha * tw;
        const [r, g, b] = s.color;
        // halo
        const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 6);
        grd.addColorStop(0, `rgba(${r},${g},${b},${a * 0.9})`);
        grd.addColorStop(0.4, `rgba(${r},${g},${b},${a * 0.2})`);
        grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(s.x - s.size * 6, s.y - s.size * 6, s.size * 12, s.size * 12);

        // core
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();

    window.addEventListener('resize', () => { resize(); build(); });
  </script>
</body>
</html>
