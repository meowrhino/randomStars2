<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>09 · Audio reactive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#020208; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    #start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-family: ui-monospace, monospace;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,230,168,0.5);
      padding: 14px 24px; border-radius: 6px; cursor: pointer;
      backdrop-filter: blur(6px); font-size: 14px;
      z-index: 10;
    }
    #start:hover { border-color: #ffe6a8; color: #ffe6a8; }
    #start.hidden { display: none; }
    #levels {
      position: fixed; top: 16px; right: 16px;
      font-family: ui-monospace, monospace; font-size: 11px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      padding: 8px 12px; border-radius: 4px;
      min-width: 120px;
      pointer-events: none;
    }
    .bar {
      display: inline-block; height: 4px;
      background: linear-gradient(90deg, #ffe6a8, #ff7070);
      vertical-align: middle; margin-left: 4px;
      border-radius: 2px;
      max-width: 60px;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">09 · Web Audio API · estrellas pulsan con los graves del micrófono</div>
  <button id="start">🎙 dale permiso al micrófono</button>
  <div id="levels" style="display:none;">
    bass: <span class="bar" id="b1"></span><br>
    mid:  <span class="bar" id="b2"></span><br>
    high: <span class="bar" id="b3"></span>
  </div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); build(); });

    const stars = [];
    function build() {
      stars.length = 0;
      const n = 350;
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          baseR: 0.5 + Math.random() * 1.5,
          freqBand: Math.floor(Math.random() * 64), // which fft bin
          color: pickColor(),
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    function pickColor() {
      const r = Math.random();
      if (r < 0.1) return [200, 220, 255];
      if (r < 0.18) return [255, 220, 180];
      return [255, 255, 255];
    }
    build();

    let analyser = null, dataArray = null, audioStarted = false;
    let bass = 0, mid = 0, high = 0;
    let bassSmooth = 0;

    const startBtn = document.getElementById('start');
    const levels = document.getElementById('levels');
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.7;
        src.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        audioStarted = true;
        startBtn.classList.add('hidden');
        levels.style.display = 'block';
      } catch (err) {
        startBtn.textContent = '⚠ permiso denegado';
      }
    });

    const t0 = performance.now();
    function frame() {
      const t = (performance.now() - t0) / 1000;

      if (audioStarted && analyser) {
        analyser.getByteFrequencyData(dataArray);
        const N = dataArray.length;
        let b = 0, m = 0, h = 0;
        const bEnd = Math.floor(N * 0.06);
        const mEnd = Math.floor(N * 0.3);
        for (let i = 0; i < bEnd; i++) b += dataArray[i];
        for (let i = bEnd; i < mEnd; i++) m += dataArray[i];
        for (let i = mEnd; i < N; i++) h += dataArray[i];
        bass = b / (bEnd * 255);
        mid  = m / ((mEnd - bEnd) * 255);
        high = h / ((N - mEnd) * 255);
        bassSmooth += (bass - bassSmooth) * 0.2;
        // update bars
        document.getElementById('b1').style.width = (bass * 60).toFixed(0) + 'px';
        document.getElementById('b2').style.width = (mid * 60).toFixed(0) + 'px';
        document.getElementById('b3').style.width = (high * 60).toFixed(0) + 'px';
      }

      // trail
      ctx.fillStyle = `rgba(2, 2, 8, ${0.18 + bassSmooth * 0.15})`;
      ctx.fillRect(0, 0, W, H);

      // huge bass pulse circle in center
      if (bassSmooth > 0.1) {
        const cx = W / 2, cy = H / 2;
        const radius = bassSmooth * Math.min(W, H) * 0.5;
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grd.addColorStop(0, `rgba(255, 100, 70, ${bassSmooth * 0.15})`);
        grd.addColorStop(1, 'rgba(255, 100, 70, 0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
      }

      for (const s of stars) {
        // each star reacts to its own fft bin
        let energy = 0;
        if (audioStarted && dataArray) {
          energy = dataArray[s.freqBand] / 255;
        }
        // bass slightly affects all stars
        const tw = 0.7 + 0.3 * Math.sin(t * 2 + s.phase);
        const r = s.baseR * (1 + energy * 6 + bassSmooth * 1.5) * tw;
        const a = 0.6 + 0.4 * tw + energy * 0.5;
        const [cr, cg, cb] = s.color;

        ctx.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(1, a)})`;
        ctx.shadowColor = `rgba(${cr},${cg},${cb},0.9)`;
        ctx.shadowBlur = 4 + energy * 18 + bassSmooth * 4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
