<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>13 · L-system constelaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#03040b; }
    canvas { display:block; width:100vw; height:100vh; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .btn {
      position: fixed; top: 16px; right: 16px;
      color: rgba(255,255,255,0.6); cursor: pointer;
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4); user-select: none;
    }
    .btn:hover { color:#ffe6a8; border-color:#ffe6a8; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">13 · L-system fractal · constelaciones que crecen como raíces</div>
  <div class="btn" id="regen">↻ regrow</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); rebuild(); });

    // L-system expansion: F=draw forward, +/- rotate, [/]= push/pop
    function expand(axiom, rules, iters) {
      let s = axiom;
      for (let i = 0; i < iters; i++) {
        let out = '';
        for (const c of s) out += rules[c] || c;
        s = out;
      }
      return s;
    }

    // We don't render the L-system directly. We *simulate* it,
    // recording every endpoint as a "star" and every segment as a connecting line.
    function growConstellation(originX, originY, baseAngle, baseLen, axiom, rules, iters, jitter = 0.2) {
      const str = expand(axiom, rules, iters);
      const stack = [];
      let x = originX, y = originY, angle = baseAngle, len = baseLen;
      const points = [];
      const lines = [];
      points.push({ x, y, depth: 0 });
      let lastIdx = 0;
      let depth = 0;
      for (const ch of str) {
        switch (ch) {
          case 'F': {
            const nx = x + Math.cos(angle) * len;
            const ny = y + Math.sin(angle) * len;
            const newIdx = points.length;
            points.push({ x: nx, y: ny, depth });
            lines.push([lastIdx, newIdx]);
            x = nx; y = ny;
            lastIdx = newIdx;
            break;
          }
          case '+': angle += (25 + (Math.random() - 0.5) * jitter * 40) * Math.PI / 180; break;
          case '-': angle -= (25 + (Math.random() - 0.5) * jitter * 40) * Math.PI / 180; break;
          case '[':
            stack.push({ x, y, angle, len, lastIdx, depth });
            len *= 0.75;
            depth++;
            break;
          case ']': {
            const s = stack.pop();
            x = s.x; y = s.y; angle = s.angle; len = s.len; lastIdx = s.lastIdx;
            depth = s.depth;
            break;
          }
        }
      }
      return { points, lines };
    }

    const presetRules = [
      // tree-like
      { axiom: 'F', rules: { 'F': 'F[+F]F[-F]F' }, iters: 3, len: 22 },
      // bushy
      { axiom: 'X', rules: { 'X': 'F[+X][-X]FX', 'F': 'FF' }, iters: 4, len: 16 },
      // spiral arm
      { axiom: 'F', rules: { 'F': 'F+F-F-F+F' }, iters: 2, len: 14 },
      // dragon
      { axiom: 'FX', rules: { 'X': 'X+YF+', 'Y': '-FX-Y' }, iters: 8, len: 8 },
      // sparse branching
      { axiom: 'F', rules: { 'F': 'F[+F]F[-F][F]' }, iters: 3, len: 18 }
    ];

    let constellations = [];
    let backgroundStars = [];
    let progress = 0; // 0..1 grow animation

    function rebuild() {
      backgroundStars = [];
      const n = Math.floor(W * H / 5000);
      for (let i = 0; i < n; i++) {
        backgroundStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() < 0.04 ? 1.4 : 0.4 + Math.random() * 0.6,
          a: 0.3 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }

      constellations = [];
      const conCount = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < conCount; i++) {
        const preset = presetRules[Math.floor(Math.random() * presetRules.length)];
        const ox = Math.random() * W * 0.8 + W * 0.1;
        const oy = Math.random() * H * 0.8 + H * 0.1;
        const baseAng = Math.random() * Math.PI * 2;
        const c = growConstellation(ox, oy, baseAng, preset.len, preset.axiom, preset.rules, preset.iters);
        // optionally rotate everything around origin
        constellations.push(c);
      }
      progress = 0;
    }
    rebuild();

    document.getElementById('regen').addEventListener('click', rebuild);

    const t0 = performance.now();
    function draw() {
      const t = (performance.now() - t0) / 1000;
      progress = Math.min(1, progress + 0.006);

      ctx.fillStyle = '#03040b';
      ctx.fillRect(0, 0, W, H);

      // background stars
      for (const s of backgroundStars) {
        const tw = 0.8 + 0.2 * Math.sin(t + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${s.a * tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // grow constellations
      for (const c of constellations) {
        const visibleLines = Math.floor(c.lines.length * progress);

        // lines (only those grown so far)
        ctx.strokeStyle = 'rgba(200, 215, 255, 0.45)';
        ctx.lineWidth = 0.7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i < visibleLines; i++) {
          const [aIdx, bIdx] = c.lines[i];
          const a = c.points[aIdx], b = c.points[bIdx];
          // depth thinning
          const alpha = 1 - a.depth * 0.15;
          ctx.globalAlpha = Math.max(0.2, alpha) * 0.5;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;

        // nodes that are reached
        const reached = new Set();
        for (let i = 0; i < visibleLines; i++) {
          reached.add(c.lines[i][0]);
          reached.add(c.lines[i][1]);
        }
        for (const idx of reached) {
          const p = c.points[idx];
          const r = 0.8 + (3 - p.depth) * 0.4;
          ctx.fillStyle = '#fff';
          ctx.shadowColor = '#fff';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.6, r), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // pulsing tip on the freshly-drawn segment
        if (visibleLines > 0 && progress < 1) {
          const [, bIdx] = c.lines[visibleLines - 1];
          const tip = c.points[bIdx];
          ctx.strokeStyle = `rgba(255, 230, 168, ${0.5 + 0.5 * Math.sin(t * 6)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(tip.x, tip.y, 5 + Math.sin(t * 6) * 2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
