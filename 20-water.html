<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>20 · Reflejo en agua</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; cursor: crosshair; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.7);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.55);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
    }
    .btn {
      position: fixed; top: 16px; right: 16px;
      color: rgba(255,255,255,0.75); cursor: pointer;
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      background: rgba(0,0,0,0.4); user-select: none; z-index: 10;
    }
    .btn:hover { color:#a8c8ff; border-color:#a8c8ff; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="btn" id="regen">↻ nuevo lago</div>
  <div class="label">20 · cielo + reflejo en lago (WebGL) · click para crear ondas que deforman las estrellas reflejadas</div>
  <canvas id="c"></canvas>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec2 uSeed;
    uniform vec2 uMoon;    // moon position in clip-uv coords (-1..1)
    uniform float uMoonR;
    uniform float uMoonPhase;
    // ripples: up to 8, packed as (x, y, born, _)
    uniform vec4 uRipples[8];

    float hash12(vec2 p) { p += uSeed; return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    vec2  hash22(vec2 p) { p += uSeed; p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      float a = hash12(i), b = hash12(i+vec2(1,0));
      float c = hash12(i+vec2(0,1)), d = hash12(i+vec2(1,1));
      vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 4; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return v;
    }

    // stars sampled at a uv (3x3 neighbour cells)
    vec3 stars(vec2 uv) {
      vec3 acc = vec3(0.0);
      for (int layer = 0; layer < 3; layer++) {
        float scale = 70.0 * pow(2.2, float(layer));
        float density = 0.18 - float(layer) * 0.04;
        vec2 g = uv * scale;
        vec2 cell = floor(g);
        vec2 f = fract(g);
        for (int dy = -1; dy <= 1; dy++) {
          for (int dx = -1; dx <= 1; dx++) {
            vec2 c = cell + vec2(float(dx), float(dy));
            float pres = hash12(c + float(layer) * 7.7);
            if (pres > density) continue;
            vec2 off = hash22(c + 1.11 + float(layer));
            vec2 d = f - vec2(float(dx), float(dy)) - off;
            float dist = length(d);
            if (dist > 1.4) continue;
            float sz = 0.045 / pow(2.0, float(layer));
            float u = hash12(c + 77.7 + float(layer));
            float flux = pow(10.0, -0.4 * (6.5 - pow(u, 4.0) * 6.5 - 5.0));
            float twPh = hash12(c + 91.1) * 6.2831;
            float tw = 0.85 + 0.15 * sin(uTime * 1.3 + twPh);
            float t = hash12(c + 51.2);
            vec3 col = t < 0.5 ? mix(vec3(1.0, 0.78, 0.55), vec3(1.0), t * 2.0)
                               : mix(vec3(1.0), vec3(0.7, 0.82, 1.0), (t - 0.5) * 2.0);
            float core = exp(-dist*dist / (sz*sz*0.55)) * tw * flux;
            float halo = exp(-dist / (sz * 3.5)) * 0.15 * flux;
            acc += col * (core * 1.3 + halo);
          }
        }
      }
      return acc;
    }

    // render the moon if (uv) hits the moon disk
    vec3 moon(vec2 uv, vec3 baseCol) {
      vec2 d = uv - uMoon;
      float r = length(d);
      vec3 col = baseCol;
      // halo
      float halo = exp(-r * r * 20.0 / (uMoonR * uMoonR)) * 0.5;
      col += vec3(1.0, 0.95, 0.85) * halo * 0.5;
      if (r < uMoonR) {
        // disk
        vec3 disk = vec3(0.96, 0.93, 0.82);
        // phase shadow (simple): blend with sky color depending on x offset
        float termX = uMoonR * cos(uMoonPhase * 6.2831);
        // for the dark side, blend toward sky color
        float side = (d.x - termX) * sign(sin(uMoonPhase * 6.2831 + 0.0001));
        float litMix = smoothstep(-uMoonR * 0.2, uMoonR * 0.2, side);
        vec3 darkSide = vec3(0.02, 0.025, 0.06);
        disk = mix(darkSide, disk, litMix);
        col = disk;
      }
      return col;
    }

    // render the FULL sky color at a given uv (for both top half and reflection)
    vec3 skyAt(vec2 uv) {
      // base gradient — darker at top
      vec3 base = mix(vec3(0.04, 0.05, 0.10), vec3(0.015, 0.02, 0.04), uv.y * 0.5 + 0.5);
      base += stars(uv);
      base = moon(uv, base);
      return base;
    }

    // ── ripple offset at world position (x,y in pixel coords, HORIZON at y=horizon) ──
    vec2 rippleOffset(vec2 pix) {
      vec2 off = vec2(0.0);
      for (int i = 0; i < 8; i++) {
        vec4 r = uRipples[i];
        if (r.z < 0.0) continue;
        float age = uTime - r.z;
        if (age < 0.0 || age > 4.5) continue;
        vec2 d = pix - r.xy;
        float dist = length(d);
        float front = age * 140.0;
        float localR = dist - front;
        if (abs(localR) > 80.0) continue;
        float env = exp(-localR * localR * 0.0015) * exp(-front * 0.005) * (1.0 - age / 4.5);
        vec2 dirN = d / max(dist, 0.001);
        // ripple displaces perpendicular to wave direction (in source uv space)
        float ampl = sin(localR * 0.25) * env * 0.020;
        off += dirN * ampl;
      }
      return off;
    }

    void main() {
      // uv: -aspect..aspect in x, -1..1 in y. y=0 is screen middle.
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      vec2 pix = gl_FragCoord.xy;
      float aspect = uRes.x / uRes.y;
      float horizonY = uRes.y * 0.5;  // horizon at middle of screen

      vec3 col;
      if (pix.y > horizonY) {
        // SKY: use uv as-is
        col = skyAt(uv);
      } else {
        // WATER: sample sky at MIRRORED y
        // distance below horizon, normalised
        float belowFrac = (horizonY - pix.y) / horizonY; // 0 at horizon, 1 at bottom
        // mirror uv: source y is positive (above horizon)
        vec2 srcUv = vec2(uv.x, -uv.y);

        // base sinusoidal waves (horizontal compression)
        float wave =
            sin(pix.y * 0.04 - uTime * 1.5) * 0.003
          + sin(pix.y * 0.10 + uTime * 0.8) * 0.0018 * (1.0 - belowFrac * 0.3);

        // ripples
        vec2 rip = rippleOffset(pix);

        // total displacement
        vec2 displacement = vec2(wave, 0.0) + rip;
        // ALSO scale ripple vertical effect a bit
        srcUv += displacement;

        col = skyAt(srcUv);

        // water tint: darker, slightly blue/black, more so with depth
        vec3 waterTint = vec3(0.01, 0.018, 0.035);
        float mixK = 0.45 + (1.0 - belowFrac) * 0.15;
        col = mix(col, waterTint, mixK);

        // glare line at horizon
        col += vec3(0.05, 0.06, 0.08) * exp(-pow((1.0 - belowFrac) * 0.0, 2.0) * 100.0); // no-op
      }

      // horizon line glow
      float horizonDist = abs(pix.y - horizonY);
      float hGlow = exp(-horizonDist * horizonDist * 0.01) * 0.15;
      col += vec3(0.03, 0.04, 0.07) * hGlow;

      // subtle grain
      float grain = (hash12(gl_FragCoord.xy + vec2(uTime * 73.0)) - 0.5) * 0.02;
      col += grain;

      col = col / (1.0 + col * 0.7);
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-family:monospace">WebGL no disponible</p>'; throw new Error('no webgl'); }

    let DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * DPR;
      canvas.height = window.innerHeight * DPR;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    function compile(t, s) {
      const sh = gl.createShader(t);
      gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
      return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uTime = gl.getUniformLocation(prog, 'uTime');
    const uSeed = gl.getUniformLocation(prog, 'uSeed');
    const uMoon = gl.getUniformLocation(prog, 'uMoon');
    const uMoonR = gl.getUniformLocation(prog, 'uMoonR');
    const uMoonPhase = gl.getUniformLocation(prog, 'uMoonPhase');
    const uRipples = gl.getUniformLocation(prog, 'uRipples');

    let seedX = Math.random() * 10000, seedY = Math.random() * 10000;
    // moon in uv coords (-aspect..aspect, -1..1)
    let moonX, moonY, moonR, moonPhase;
    function randomMoon() {
      const aspect = window.innerWidth / window.innerHeight;
      moonX = (Math.random() - 0.5) * aspect * 1.4;
      moonY = 0.2 + Math.random() * 0.6;
      moonR = 0.04 + Math.random() * 0.04;
      moonPhase = Math.random();
    }
    randomMoon();

    document.getElementById('regen').addEventListener('click', () => {
      seedX = Math.random() * 10000;
      seedY = Math.random() * 10000;
      randomMoon();
    });

    // ripples: array of {x, y, born} in pixel coords (CSS pixels)
    const ripples = []; // max 8
    canvas.addEventListener('click', e => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * DPR;
      // canvas y is flipped: pix.y = canvas.height - cssY*DPR
      const y = canvas.height - (e.clientY - r.top) * DPR;
      if (y < canvas.height / 2) {
        ripples.push({ x, y, born: performance.now() / 1000 });
        if (ripples.length > 8) ripples.shift();
      }
    });

    const t0 = performance.now();
    function frame() {
      const t = (performance.now() - t0) / 1000;
      // prune old ripples
      while (ripples.length && t - ripples[0].born > 4.5) ripples.shift();
      // pack into 8 vec4s
      const packed = new Float32Array(32);
      for (let i = 0; i < 8; i++) {
        const r = ripples[i];
        if (r) {
          packed[i * 4 + 0] = r.x;
          packed[i * 4 + 1] = r.y;
          packed[i * 4 + 2] = r.born - (t0 / 1000); // already absolute; we send "born seconds from start"
          packed[i * 4 + 3] = 0;
        } else {
          packed[i * 4 + 0] = 0;
          packed[i * 4 + 1] = 0;
          packed[i * 4 + 2] = -1;
          packed[i * 4 + 3] = 0;
        }
      }
      // we send raw born-seconds-since-page-start; in shader compute age = uTime - r.z (both in same epoch)
      // Adjust: send (r.born - pageStart) which is what we passed; uTime is (performance.now()-t0)/1000.
      // So age = uTime - (r.born - t0/1000) = (perf - t0)/1000 - r.born + t0/1000 = (perf/1000) - r.born
      // Hmm this is getting messy. Let me simplify: send rippleAge directly.
      for (let i = 0; i < 8; i++) {
        const r = ripples[i];
        if (r) {
          packed[i * 4 + 2] = t - (r.born - 0); // wait, r.born was performance.now()/1000, and t = (perf - t0)/1000
          // ageInSeconds = (perf/1000) - r.born
          // Send r.born offset relative to t0 so we can compute age = t - rel
          packed[i * 4 + 2] = r.born - (t0 / 1000);
        }
      }

      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform2f(uSeed, seedX, seedY);
      gl.uniform2f(uMoon, moonX, moonY);
      gl.uniform1f(uMoonR, moonR);
      gl.uniform1f(uMoonPhase, moonPhase);
      gl.uniform4fv(uRipples, packed);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
