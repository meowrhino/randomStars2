<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>12 · gravity sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#02030a; color:#fff; }
    canvas { display:block; width:100vw; height:100vh; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .back {
      position: fixed; top: 16px; left: 16px;
      color: rgba(255,255,255,0.6);
      font-family: ui-monospace, monospace; font-size: 12px;
      text-decoration: none; z-index: 10;
      padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: rgba(0,0,0,0.4);
    }
    .back:hover { color:#fff; }
    .label {
      position: fixed; bottom: 16px; left: 16px;
      color: rgba(255,255,255,0.45);
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
      max-width: 60%;
    }
    .ui {
      position: fixed; top: 16px; right: 16px;
      font-family: ui-monospace, monospace; font-size: 11px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px; border-radius: 4px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .ui label { display: flex; justify-content: space-between; gap: 12px; align-items:center; }
    .ui input[type=range] { width: 100px; }
    .ui button {
      background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 11px;
    }
    .ui button:hover { color: #ffe6a8; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <div class="label">12 · n-body físico · click para añadir un atractor masivo · arrastra para empujar</div>
  <div class="ui">
    <label>G <input type="range" id="g" min="0" max="200" value="40"></label>
    <label>drag <input type="range" id="drag" min="0" max="100" value="2"></label>
    <label>trails <input type="checkbox" id="trails" checked></label>
    <button id="reset">↻ reset</button>
  </div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); buildBg(); });

    const N = 220;
    let stars = [];
    let bgStars = [];
    function buildBg() {
      bgStars = [];
      const n = Math.floor(W * H / 1800);
      for (let i = 0; i < n; i++) {
        bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() < 0.04 ? 1.4 : 0.3 + Math.random() * 0.6,
          a: 0.15 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          twSpeed: 0.3 + Math.random() * 1.0
        });
      }
    }
    buildBg();
    function init() {
      stars = [];
      for (let i = 0; i < N; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * Math.min(W, H) * 0.4;
        stars.push({
          x: W / 2 + Math.cos(a) * r,
          y: H / 2 + Math.sin(a) * r,
          vx: Math.cos(a + Math.PI / 2) * 0.4,
          vy: Math.sin(a + Math.PI / 2) * 0.4,
          m: 0.5 + Math.random() * 1.5,
          color: pickColor()
        });
      }
      // a couple of heavier ones
      for (let i = 0; i < 3; i++) {
        stars[i].m = 8 + Math.random() * 6;
      }
      attractors = [];
    }
    function pickColor() {
      const r = Math.random();
      if (r < 0.1) return [200, 220, 255];
      if (r < 0.18) return [255, 220, 180];
      if (r < 0.20) return [255, 160, 130];
      return [255, 255, 255];
    }
    init();

    let attractors = []; // user-placed massive attractors
    canvas.addEventListener('click', e => {
      const r = canvas.getBoundingClientRect();
      attractors.push({
        x: e.clientX - r.left,
        y: e.clientY - r.top,
        m: 25,
        born: performance.now()
      });
      if (attractors.length > 5) attractors.shift();
    });

    // drag to push
    let drag = null;
    canvas.addEventListener('mousedown', e => {
      const r = canvas.getBoundingClientRect();
      drag = { x: e.clientX - r.left, y: e.clientY - r.top, px: e.clientX - r.left, py: e.clientY - r.top };
    });
    canvas.addEventListener('mousemove', e => {
      if (!drag) return;
      const r = canvas.getBoundingClientRect();
      drag.px = drag.x; drag.py = drag.y;
      drag.x = e.clientX - r.left;
      drag.y = e.clientY - r.top;
      // impart velocity to nearby stars
      const dx = drag.x - drag.px, dy = drag.y - drag.py;
      for (const s of stars) {
        const ddx = s.x - drag.x, ddy = s.y - drag.y;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 < 8000) {
          const w = 1 - d2 / 8000;
          s.vx += dx * 0.15 * w;
          s.vy += dy * 0.15 * w;
        }
      }
    });
    canvas.addEventListener('mouseup', () => { drag = null; });
    canvas.addEventListener('mouseleave', () => { drag = null; });

    document.getElementById('reset').addEventListener('click', init);

    function draw() {
      const trails = document.getElementById('trails').checked;
      const G = parseFloat(document.getElementById('g').value) * 0.001;
      const dragCoef = parseFloat(document.getElementById('drag').value) * 0.0005;

      if (trails) {
        ctx.fillStyle = 'rgba(2, 3, 10, 0.12)';
        ctx.fillRect(0, 0, W, H);
      } else {
        ctx.fillStyle = '#02030a';
        ctx.fillRect(0, 0, W, H);
      }

      // background field of tiny static stars (parallax-static)
      const t = performance.now() / 1000;
      for (const s of bgStars) {
        const tw = 0.7 + 0.3 * Math.sin(t * s.twSpeed + s.phase);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.a * tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // gravitational interactions: O(n^2), n=220 → ~48k ops/frame, ok
      const len = stars.length;
      for (let i = 0; i < len; i++) {
        const a = stars[i];
        let fx = 0, fy = 0;
        for (let j = 0; j < len; j++) {
          if (i === j) continue;
          const b = stars[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          let d2 = dx * dx + dy * dy + 25; // soften
          const f = G * b.m / d2;
          const d = Math.sqrt(d2);
          fx += f * dx / d;
          fy += f * dy / d;
        }
        // user attractors
        for (const att of attractors) {
          const dx = att.x - a.x;
          const dy = att.y - a.y;
          let d2 = dx * dx + dy * dy + 100;
          const f = G * att.m / d2 * 10;
          const d = Math.sqrt(d2);
          fx += f * dx / d;
          fy += f * dy / d;
        }
        a.vx += fx;
        a.vy += fy;
        a.vx *= (1 - dragCoef);
        a.vy *= (1 - dragCoef);
        a.x += a.vx;
        a.y += a.vy;

        // wrap softly at edges
        if (a.x < -50) a.x = W + 50;
        if (a.x > W + 50) a.x = -50;
        if (a.y < -50) a.y = H + 50;
        if (a.y > H + 50) a.y = -50;
      }

      // draw user attractors
      const now = performance.now();
      for (const att of attractors) {
        const age = (now - att.born) / 1000;
        const ringR = 8 + age * 30;
        const ringA = Math.max(0, 1 - age / 1.5);
        ctx.strokeStyle = `rgba(255, 230, 168, ${ringA})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(att.x, att.y, ringR, 0, Math.PI * 2);
        ctx.stroke();
        // core
        ctx.fillStyle = '#ffe6a8';
        ctx.shadowColor = '#ffe6a8';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(att.x, att.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // draw stars
      for (const s of stars) {
        const r = s.m * 0.6 + 0.3;
        const [cr, cg, cb] = s.color;
        ctx.fillStyle = `rgba(${cr},${cg},${cb},0.9)`;
        ctx.shadowColor = `rgba(${cr},${cg},${cb},0.8)`;
        ctx.shadowBlur = s.m * 3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
